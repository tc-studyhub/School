function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">Geography practice</span><h1>Know the world.<br>Find your way.</h1><p>A few questions at a time. Think first, use a hint if you need one, then try the tricky ones again.</p><div class="actions"><button class="primary" id="quick-start">Start 10 questions →</button><button id="home-review">Review first</button></div></div><div class="hero-art">${worldSVG(null,true)}</div></section><section class="cards"><article class="card"><div class="iconbox">${icon('globe')}</div><h3>Test what you remember</h3><p>World maps, geography, the environment and map symbols. Get a clear explanation after each answer.</p><button id="card-quiz">Choose a quiz</button></article><article class="card"><div class="iconbox">${icon('grid')}</div><h3>Practise on a real grid</h3><p>Type a reference or find a square. Read eastings first, then northings.</p><button id="card-grid">Open grid practice</button></article><article class="card"><div class="iconbox">${icon('cards')}</div><h3>Say it before you reveal it</h3><p>Use recall cards to explain an answer in your own words, then check it.</p><button id="card-recall">Open recall cards</button></article></section><section class="panel" style="margin-top:22px"><div class="row"><h3>A short routine</h3><small>${saved.rounds} quiz round${saved.rounds===1?'':'s'} completed${saved.rounds?' · Best first-try score: '+saved.best+'%':''}</small></div><div class="steps"><div class="step"><b>1</b><span>Review one topic, then close the answers.</span></div><div class="step"><b>2</b><span>Try 10 questions and a few grid references.</span></div><div class="step"><b>3</b><span>Retry anything you missed. Have another short go tomorrow.</span></div></div></section><details><summary>What is included?</summary><p>Only the topics visible on your four pages: continents and oceans; latitude, longitude, tropics and hemispheres; human and physical geography; map symbols; the environment paragraph; function quizSetup(){quiz=null;app.innerHTML=`<section class="panel"><span class="eyebrow">Quiz</span><h2>A little at a time</h2><p class="muted">Choose a topic. Answers move around, and you can ask for a hint. Your score counts what you got right before seeing the answer.</p><label for="topic">Topic</label><select id="topic">${Object.entries(GROUPS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><label for="length">Questions this round</label><select id="length"><option value="10">10 questions</option><option value="5">5 questions</option><option value="20">20 questions</option></select><div class="actions"><button id="begin" class="primary">Start quiz →</button>${saved.missed.length?'<button id="saved-retry">Retry saved tricky questions</button>':''}</div><div class="note">Some questions use a map or ask you to type a grid reference. For longer explanations in your own words, use <strong>Recall cards</strong>.</div></section>`;$('#begin').onclick=()=>startQuiz($('#topic').value,Number($('#length').value));if($('#saved-retry'))$('#saved-retry').onclick=()=>startQuiz('all',99,bank.filter(q=>saved.missed.includes(q.id)))}
function startQuiz(group='all',n=10,custom=null){page='quiz';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let pool=custom||bank.filter(q=>group==='all'||q.group===group);let picked;if(!custom&&group==='all'){let buckets=['world','ideas','symbols','grids'].map(g=>shuffle(pool.filter(q=>q.group===g)));picked=[];while(picked.length<Math.min(n,pool.length)){for(const b of shuffle(buckets)){if(b.length&&picked.length<n)picked.push(b.pop())}}picked=shuffle(picked)}else picked=shuffle(pool).slice(0,n);let slots=[];while(slots.length<picked.filter(q=>q.type==='mc').length)slots.push(...shuffle([0,1,2,3]));let slotIndex=0;picked=picked.map(q=>({...q,slot:q.type==='mc'?slots[slotIndex++]:null}));quiz={items:picked,index:0,correct:0,missed:[],revealed:false,selected:null,history:[],hinted:0};renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){const q=quiz.items[quiz.index];if(!q)return quizResult();quiz.revealed=false;quiz.selected=null;quiz.order=q.options?shuffle(q.options.filter(o=>o!==q.a)):[];if(q.options)quiz.order.splice(q.slot,0,q.a);app.innerHTML=`<section class="panel"><div class="row"><span class="eyebrow">${GROUPS[q.group]}</span><small>Question ${quiz.index+1} of ${quiz.items.length}</small></div><div class="progress"><span style="width:${quiz.index/quiz.items.length*100}%"></span></div>${q.world?`<div class="mapbox">${worldSVG(q.world)}</div><p class="mapcaption">Simplified world map · identify the blue dot.</p>`:''}${q.grid||q.gridAll?`<div class="mapbox" style="max-width:570px;margin:auto">${gridSVG(q.grid||null)}</div><p class="mapcaption">Blue ring = the feature to find. Read the square’s left and bottom lines.</p>`:''}${q.symbol?`<div class="note" style="display:inline-flex;margin:0;padding:20px">${symbol(q.symbol,36,36,72).replace('x="0" y="0"','x="0" y="0"')}</div>`:''}<h2 class="question">${q.q}</h2>${q.type==='mc'?`<div class="options" role="group" aria-label="Answer options">${quiz.order.map((o,i)=>`<button class="option" data-option="${i}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<label for="quiz-answer">Four-figure reference</label><input id="quiz-answer" class="code" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 0839" maxlength="12"><small>Keep the zero at the start. Spaces and slashes are accepted.</small>`}<div class="actions"><button id="check" class="primary">Check answer</button><button id="hint">Hint</button><button id="reveal">Show answer</button></div><div id="hint-text" class="hint hidden"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden">${quiz.index+1===quiz.items.length?'See results':'Next question →'}</button></div></section>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(quiz.revealed)return;quiz.selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(t=>{t.classList.toggle('selected',t===b);t.setAttribute('aria-pressed',t===b?'true':'false')})});$('#hint').onclick=()=>{const h=$('#hint-text');h.classList.remove('hidden');h.textContent=q.hint;$('#hint').disabled=true;quiz.hinted++};$('#check').onclick=()=>checkQuiz(false);$('#reveal').onclick=()=>checkQuiz(true);$('#next').onclick=()=>{quiz.index++;renderQuestion();window.scrollTo(0,0)};if($('#quiz-answer'))$('#quiz-answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkQuiz(false)})}
function checkQuiz(reveal){if(quiz.revealed)return;const q=quiz.items[quiz.index];let given=q.type==='mc'?(quiz.selected===null?'':quiz.order[quiz.selected]):$('#quiz-answer').value;if(!reveal&&!given.trim()){ $('#feedback').innerHTML='<p class="hint">Choose or type an answer first, or use “Show answer”.</p>';return}let good=!reveal&&(q.answers||[q.a,...(q.aliases||[])]).map(norm).includes(norm(given));quiz.revealed=true;quiz.correct+=good?1:0;if(!good)quiz.missed.push(q);quiz.history.push({q,given:reveal?'Answer revealed':given,good,reveal});if(good)saved.missed=saved.missed.filter(id=>id!==q.id);else if(!saved.missed.includes(q.id))saved.missed.push(q.id);persist();$('#feedback').innerHTML=`<div class="feedback ${good?'':'retry'}"><strong>${good?'You’ve got it.':reveal?'Answer to remember':'Let’s remember this one.'}</strong><p>${esc(q.ex)}</p>${!good?'<small>You can practise this again at the end.</small>':''}</div>`;document.querySelectorAll('[data-option]').forEach((b,i)=>{b.disabled=true;const a=quiz.order[i];b.classList.toggle('correct',a===q.a);b.classList.toggle('wrong',!good&&!reveal&&i===quiz.selected)});if($('#quiz-answer'))$('#quiz-answer').disabled=true;$('#check').disabled=true;$('#reveal').disabled=true;$('#next').classList.remove('hidden');$('#next').focus()}
function quizResult(){let pct=Math.round(100*quiz.correct/quiz.items.length);saved.rounds++;saved.best=Math.max(saved.best,pct);persist();let missed=quiz.missed;app.innerHTML=`<section class="panel"><span class="eyebrow">Round complete</span><h2>${missed.length?'Good practice. Now make it stick.':'Everything right this round.'}</h2><div class="mini-stats"><div><div class="stat">${quiz.correct}/${quiz.items.length}</div><small>right before revealing</small></div><div><div class="stat">${missed.length}</div><small>to practise again</small></div></div><p class="muted">${missed.length?'Read the explanation, then retry without looking.':'Try saying the answers aloud again tomorrow, without looking at the notes.'}</p><div class="actions">${missed.length?'<button id="retry-round" class="primary">Retry these questions →</button>':''}<button id="new-round">New 10-question round</button><button id="result-home">Overview</button></div></section><section class="panel"><h3>Your answers</h3>${quiz.history.map(h=>`<div class="reviewitem"><small>${h.good?'✓ Remembered':'↻ Practise again'} · ${GROUPS[h.q.group]}</small><strong>${esc(h.q.q)}</strong>${h.q.world?`<small>Map marker: ${h.q.a}</small>`:''}<p>${esc(h.q.ex)}</p>${!h.good?`<small>Your answer: ${esc(h.given)}</small>`:''}</div>`).join('')}</section>`;if($('#retry-round'))$('#retry-round').onclick=()=>startQuiz('all',99,missed);$('#new-round').onclick=()=>startQuiz();$('#result-home').onclick=()=>showPage('home')}
function keyHTML(){return `<div class="keylist">${[...features.map(f=>[f.s,f.name]),['bridge','Bridge'],['golf','Golf course'],['road','Secondary road'],['wood','Wood'],['lake','Lake']].map(([s,n])=>`<div class="keyitem">${symbol(s,13,13,26)}<span>${n}</span></div>`).join('')}</div>`}
function nextGrid(){gridAnswered=false;gridChosen=null;const prev=gridQuestion?.ref;if(gridKind==='six'){let ex=1+Math.floor(Math.random()*8),ny=1+Math.floor(Math.random()*8);gridQuestion={ex,ny,ref:'12'+ex+'36'+ny,name:'blue dot',task:'type'}}else if(gridKind==='london'){gridQuestion={...shuffle(london.filter(t=>t.ref!==prev))[0],task:Math.random()<.5?'type':'tap'}}else{gridQuestion={...shuffle(features.filter(t=>t.ref!==prev))[0],task:Math.random()<.6?'type':'tap'}}renderGrid()}
function gridPage(){gridCount=0;gridScore=0;gridKind='four';nextGrid()}
function renderGrid(){const q=gridQuestion,six=gridKind==='six',tap=q.task==='tap';app.innerHTML=`<section class="panel grid-panel"><div class="row"><div><span class="eyebrow">Grid practice</span><h2>Across first. Then up.</h2></div><small id="grid-tally">${gridScore}/${gridCount} right before revealing</small></div><div class="map-toggle" aria-label="Choose grid"><button data-kind="four" aria-pressed="${gridKind==='four'}">Worksheet map</button><button data-kind="london" aria-pressed="${gridKind==='london'}">London examples</button><button data-kind="six" aria-pressed="${six}">Six figures <span class="badge">Optional</span></button></div>${six?'<div class="note">Six figures are in the lesson heading, but no worked example is visible. Use this optional practice only if your teacher has taught the method. This is a practice dot, not a real landmark.</div>':''}<p class="question" id="grid-task">${six?'Give the six-figure reference for the blue dot.':tap?`Tap square <span style="color:var(--blue)">${q.ref}</span> on the grid.`:`Give the four-figure reference for ${gridKind==='london'?esc(q.name):'the '+esc(q.name.toLowerCase())}.`}</p><div class="split"><div><div id="grid-map" class="mapbox">${gridSVG(q,{tap,kind:gridKind})}</div><p class="mapcaption">${six?'Each small division is one tenth of the square.':gridKind==='london'?'Practice positions use the five references written in your London notes.':'Redrawn from your worksheet · feature squares preserved.'}</p>${gridKind==='four'?'<button id="source-open" class="back">View original map and key</button>':''}</div><div>${tap?'<p>Tap once to choose a square. Then check your answer.</p><div id="tap-status" class="note" aria-live="polite">No square selected yet.</div>':`<label for="grid-answer">${six?'Six':'Four'}-figure reference</label><input id="grid-answer" class="code" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="${six?'••• •••':'•• ••'}" aria-describedby="input-help"><small id="input-help">${six?'Three digits for eastings, then three for northings.':'Two digits for eastings, then two for northings. Keep leading zeros.'}</small>`}<div class="actions"><button id="grid-check" class="primary">Check answer</button><button id="grid-hint">Hint</button><button id="grid-reveal">Show answer</button></div><div id="grid-hint-text" class="hint hidden"></div><div id="grid-feedback" aria-live="polite"></div><div class="actions"><button id="grid-next" class="primary hidden">Next reference →</button></div>${gridKind==='four'?'<details><summary>Map key</summary>'+keyHTML()+'</details>':''}<details><summary>${six?'How do six figures work?':'How do four figures work?'}</summary>${six?'<p>Start with the square’s left easting. Add how many tenths across the dot is. Then use the bottom northing and add how many tenths up it is.</p><p>Example: 12 + 3 tenths across → <strong>123</strong>. 36 + 7 tenths up → <strong>367</strong>. Together: <strong>123367</strong>.</p>':'<p>1. Find the grid line to the <strong>left</strong> of the feature: the easting.</p><p>2. Find the line <strong>below</strong> it: the northing.</p><p>3. Join the two pairs. Easting 08 and northing 39 make <strong>0839</strong>.</p><p>“Along the corridor, then up the stairs.”</p>'}</details></div></div></section>`;
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{gridKind=b.dataset.kind;gridQuestion=null;gridScore=gridCount=0;nextGrid()});if(tap)wireCells();if($('#source-open'))$('#source-open').onclick=()=>$('#source-dialog').showModal();$('#grid-check').onclick=()=>checkGrid(false);$('#grid-reveal').onclick=()=>checkGrid(true);$('#grid-next').onclick=nextGrid;$('#grid-hint').onclick=()=>{let hint=six?'Count tenths across from 12. Then count tenths up from 36. Keep the two groups of three in that order.':tap?'Split the reference into two pairs. The first pair is the square’s left line; the second pair is its bottom line.':'Follow the circled feature down to the easting on its left, then across to the northing below it.';$('#grid-hint-text').textContent=hint;$('#grid-hint-text').classList.remove('hidden')};if($('#grid-answer'))$('#grid-answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkGrid(false)})}
function wireCells(){document.querySelectorAll('[data-ref]').forEach(c=>{const act=()=>{if(gridAnswered)return;gridChosen=c.dataset.ref;document.querySelectorAll('[data-ref]').forEach(el=>el.classList.toggle('chosen',el===c));$('#tap-status').textContent='Square selected. Ready to check?'};c.onclick=act;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}})}
function checkGrid(reveal){if(gridAnswered)return;let q=gridQuestion,given=q.task==='tap'?gridChosen:$('#grid-answer').value;if(!reveal&&(!given||!given.trim())){$('#grid-feedback').innerHTML='<p class="hint">Choose a square or type your reference first.</p>';return}gridAnswered=true;let good=!reveal&&norm(given)===q.ref;gridCount++;if(good)gridScore++;$('#grid-tally').textContent=`${gridScore}/${gridCount} right before revealing`;let explanation=gridKind==='six'?`Easting 12 + ${q.ex} tenths → 12${q.ex}. Northing 36 + ${q.ny} tenths → 36${q.ny}. Join them: ${q.ref}.`:`Read ${q.ref.slice(0,2)} across, then ${q.ref.slice(2)} up. The square is ${q.ref}.`;$('#grid-feedback').innerHTML=`<div class="feedback ${good?'':'retry'}"><strong>${good?'You’ve got it.':reveal?'Answer to remember':'Try to picture the square.'}</strong><p>${explanation}</p>${q.task==='tap'&&gridKind==='four'?`<small>This is the square containing the ${q.name.toLowerCase()}.</small>`:''}</div>`;if(q.task==='tap'){$('#grid-map').innerHTML=gridSVG(q,{tap:true,kind:gridKind,answer:true})}if($('#grid-answer'))$('#grid-answer').disabled=true;$('#grid-check').disabled=true;$('#grid-reveal').disabled=true;$('#grid-next').classList.remove('hidden');$('#grid-next').focus()}
const recallBank=[...bank.map(q=>({...q,a:q.ex})),...written];
function recallPage(){recallOrder=shuffle(recallBank.filter(q=>recallGroup==='all'||q.group===recallGroup));recallIndex=0;recallShow=false;renderRecall()}
function renderRecall(){let q=recallOrder[recallIndex];app.innerHTML=`<section class="panel"><div class="row"><span class="eyebrow">Recall cards</span><small>${recallIndex+1} of ${recallOrder.length}</small></div><label for="recall-topic">Topic</label><select id="recall-topic">${Object.entries(GROUPS).map(([v,l])=>`<option value="${v}" ${v===recallGroup?'selected':''}>${l}</option>`).join('')}</select><div class="flashcard">${q.world?`<div class="mapbox">${worldSVG(q.world)}</div>`:''}${q.symbol?symbol(q.symbol,36,36,72):''}${q.grid||q.gridAll?`<div class="mapbox" style="max-width:480px;margin:auto;width:100%">${gridSVG(q.grid||null)}</div>`:''}<h2 class="question">${q.q}</h2><p class="muted">Say your answer out loud, or jot it below. Then reveal and compare.</p><label class="sr-only" for="recall-answer">Your own answer</label><textarea id="recall-answer" rows="2" placeholder="My answer…"></textarea><div id="recall-revealed" class="studyanswer hidden" style="margin-top:18px">${esc(q.a)}</div><div id="recall-hint-text" class="hint hidden">${esc(q.hint)}</div></div><div class="actions"><button id="recall-reveal" class="primary">Reveal answer</button><button id="recall-hint">Hint</button><button id="recall-again" class="hidden">Practise again</button><button id="recall-got" class="hidden">I remembered it →</button></div><p id="recall-message" class="muted" aria-live="polite"></p><small>Compare the meaning, not the exact words. These answers are self-checked.</small></section>`;$('#recall-topic').onchange=()=>{recallGroup=$('#recall-topic').value;recallPage()};$('#recall-reveal').onclick=()=>{$('#recall-revealed').classList.remove('hidden');$('#recall-again').classList.remove('hidden');$('#recall-got').classList.remove('hidden');$('#recall-reveal').classList.add('hidden')};$('#recall-hint').onclick=()=>$('#recall-hint-text').classList.remove('hidden');$('#recall-again').onclick=()=>{recallOrder.push(q);recallIndex++;if(recallIndex>=recallOrder.length)recallIndex=0;renderRecall();$('#recall-message').textContent='That card has been added again later in this round.'};$('#recall-got').onclick=()=>{recallIndex=(recallIndex+1)%recallOrder.length;renderRecall()}}
function notesPage(){app.innerHTML=`<section class="panel"><span class="eyebrow">Review notes</span><h2>Look, cover, explain.</h2><p class="muted">Read one small section. Hide it, say what you remember, then check.</p><div class="actions"><button class="primary" id="notes-recall">Try recall cards →</button><button id="notes-quiz">Try 10 questions</button></div></section><section class="panel"><h3>World map</h3><div class="mapbox">${worldSVG(null,true)}</div><div class="coverage" style="margin-top:18px"><div><strong>Seven continents</strong><p>North America, South America, Europe, Africa, Asia, Oceania, Antarctica.</p><small>Your map uses “Oceania”, so that is the label used here.</small></div><div><strong>Five oceans</strong><p>Pacific Ocean, Atlantic Ocean, Indian Ocean, Arctic Ocean, Southern Ocean.</p><small>The Pacific appears on both sides of a flat world map.</small></div></div></section><section class="panel"><h3>Latitude, longitude and hemispheres</h3><div class="studylist"><div class="studyrow"><strong>Latitude and the Equator</strong><p>Latitude lines run around the Earth from east to west. The Equator is a line of latitude.</p></div><div class="studyrow"><strong>Longitude</strong><p>Lines of longitude run from the North Pole to the South Pole. Remember: “long and tall”.</p></div><div class="studyrow"><strong>The tropics</strong><p>Tropic of Cancer: 23.5° N.<br>Tropic of Capricorn: 23.5° S.</p></div><div class="studyrow"><strong>Hemispheres</strong><p>North of the Equator: Northern Hemisphere.<br>South of the Equator: Southern Hemisphere.<br>The world map also labels the Western and Eastern Hemispheres.</p></div></div></section><section class="panel"><h3>Geography and the environment</h3><div class="studylist">${written.map(q=>`<div class="studyrow"><strong>${q.q}</strong><p>${q.a}</p></div>`).join('')}<div class="studyrow"><strong>What does “as the crow flies” mean?</strong><p>In a direct, straight line.</p></div></div></section><section class="panel"><h3>Four Figure Grid References</h3><p><strong>Eastings first, then northings.</strong> Find the line to the left of the feature, then the line below it. Join the two pairs.</p><p>For example, easting 08 and northing 39 make <strong>0839</strong>. This gives the square containing the windmill.</p><p class="muted">A four-figure reference identifies a square, rather than an exact point.</p><div class="split"><div class="mapbox">${gridSVG()}</div><div><h3>Map key</h3>${keyHTML()}</div></div><details><summary>Worksheet answers: check after trying</summary><div class="studylist">${features.map(f=>`<div class="studyrow"><strong>${f.name}</strong><p>${f.ref}</p></div>`).join('')}<div class="studyrow"><strong>A bridge</strong><p>0740 or 0841.</p></div><div class="studyrow"><strong>Examples of squares containing areas</strong><p>Lake: 1043. Wood: 0743. Golf course: 1139. Other squares containing part of each area can also be valid.</p></div></div></details><details><summary>London examples from the written notes</summary><div class="studylist">${london.map(l=>`<div class="studyrow"><strong>${l.name}</strong><p>${l.ref}</p></div>`).join('')}</div><p class="muted">These practice positions use the written examples. The street-map photograph is too soft to check every marker precisely.</p></details><div class="actions"><button id="notes-grids" class="primary">Practise grid references →</button></div></section><section class="panel"><h3>Six-figure references <span class="badge">Optional</span></h3><p>Six-figure references appear in the lesson heading, but the photographs do not show a worked method. Practise this only if you have covered it in class.</p><p>A six-figure reference locates a point more precisely within a square. Add tenths across to the easting, then tenths up to the northing.</p><p>Example: 12 and 3 tenths → <strong>123</strong>; 36 and 7 tenths → <strong>367</strong>. Together: <strong>123367</strong>.</p></section><details><summary>For a parent: scope and checking</summary><p>The four supplied pages are the sole source for the question topics. Wording has been made clear for Year 7. Map and grid diagrams are practice redrawings; no extra geography unit has been added. Six-figure practice is optional and excluded from the main quiz.</p><p>The five London references follow the written notes. The school worksheet key, rather than any uncertain handwritten label, is used for symbols. The isolated words “tunnel”, “road” and “bridge” below the worksheet have no matching question visible; no unseen tunnel-symbol question has been invented.</p><p>Open explanations are self-checked against a model answer. They are not marked wrong for using different wording. The quiz records revealed answers for further practice.</p><p>There is no account, tracking or server score storage inside this quiz. Saved results belong to this browser and do not sync between devices.</p></details>`;$('#notes-recall').onclick=()=>showPage('recall');$('#notes-quiz').onclick=()=>startQuiz();$('#notes-grids').onclick=()=>showPage('grids')}
$('#close-source').onclick=()=>$('#source-dialog').close();
home();
</script></body></html>
