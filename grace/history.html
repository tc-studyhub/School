function nav(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='quiz')setup();if(tab==='timeline')showTimeline();if(tab==='recall')recall();if(tab==='notes')showNotes();window.scrollTo(0,0)}
function home(){view.innerHTML='<section class="card"><div class="row"><div><span class="eyebrow">Pick a lesson</span><h2>Newest lessons first</h2></div><button class="primary" id="mix">Mix everything →</button></div><p class="muted">'+quizBank.length+' questions in the bank. Ten-question rounds, explanations after each check and a retry for missed questions.</p></section><div class="topics">'+newestFirst().map((g,i)=>'<article class="topic"><span class="eyebrow">'+(i===0?'Latest lesson':'Earlier lesson')+'</span><h3>'+g[1]+'</h3><p>'+g[2]+'</p><button data-group="'+g[0]+'">Practice →</button></article>').join('')+'</div><section class="card"><h3>Keep improving</h3><p class="muted">Aim for 85% or higher. Review explanations, then retry the questions you missed on this device.</p>'+(saved.missed.length?'<button id="retryAll">Retry '+saved.missed.length+' missed</button>':'')+'</section>';$('#mix').onclick=()=>startRound('all',10);document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>startRound(b.dataset.group,10));if($('#retryAll'))$('#retryAll').onclick=()=>startRound('all',Math.min(saved.missed.length,20),true)}
function setup(){view.innerHTML='<section class="card"><h2>Choose your quiz</h2><p class="muted">Latest lesson appears first; use “All topics” to revise everything.</p><label class="label" for="topic">Topic</label><select id="topic"><option value="all">All London history</option>'+newestFirst().map(g=>'<option value="'+g[0]+'">'+g[1]+'</option>').join('')+'</select><div class="actions"><button class="primary" id="ten">10 questions</button><button id="twenty">20-question challenge</button>'+(saved.missed.length?'<button id="retry">Retry mistakes</button>':'')+'</div></section>';$('#ten').onclick=()=>startRound($('#topic').value,10);$('#twenty').onclick=()=>startRound($('#topic').value,20);if($('#retry'))$('#retry').onclick=()=>startRound('all',Math.min(saved.missed.length,20),true)}
function startRound(group,count,onlyMissed=false,source=null){let pool=source||quizBank.filter(q=>(group==='all'||q.g===group)&&(!onlyMissed||saved.missed.includes(q.id)));if(!pool.length){home();return}let pick=[];for(const type of ['match','multi','tf']){let candidates=shuffle(pool.filter(q=>q.t===type));if(candidates.length&&pick.length<count)pick.push(candidates[0])}pick=shuffle(pick.concat(shuffle(pool.filter(q=>!pick.includes(q))).slice(0,count-pick.length)));state={questions:pick,index:0,score:0,history:[],picked:new Set(),checked:false,match:[]};document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='quiz'));renderQuestion();window.scrollTo(0,0)}
function correctAnswer(q){return q.t==='match'?q.pairs.map(p=>p.join(' → ')).join('; '):q.t==='multi'?q.answers.map(i=>q.options[i]).join('; '):q.options[q.answer]}
function renderQuestion(){const q=state.questions[state.index];state.picked=new Set();state.checked=false;let html='<section class="card"><div class="row"><span class="eyebrow">'+groups.find(g=>g[0]===q.g)[1]+'</span><span class="muted">'+(state.index+1)+' / '+state.questions.length+'</span></div><div class="progress"><div style="width:'+(100*state.index/state.questions.length)+'%"></div></div><h2>'+esc(q.q)+'</h2>';
if(q.t==='mc'||q.t==='tf'||q.t==='multi'){if(q.t==='multi')html+='<p class="muted">Choose every correct answer.</p>';let order=shuffle(q.options.map((_,i)=>i));html+='<div class="choices">'+order.map(i=>'<button class="choice" data-choice="'+i+'" aria-pressed="false">'+esc(q.options[i])+'</button>').join('')+'</div>'}else{let order=shuffle(q.pairs.map((_,i)=>i));html+='<p class="muted">Match the words to the definitions.</p>'+q.pairs.map((p,i)=>'<div class="match"><strong>'+esc(p[0])+'</strong><select data-match="'+i+'" aria-label="Meaning for '+esc(p[0])+'"><option value="">Choose meaning</option>'+order.map(j=>'<option value="'+j+'">'+esc(q.pairs[j][1])+'</option>').join('')+'</select></div>').join('')}
html+='<div class="actions"><button class="primary" id="check">Check answer</button><button id="hint">Hint</button></div><div id="hintBox" class="hint hidden"></div><div id="feedback"></div><div class="actions"><button id="next" class="primary hidden">'+(state.index===state.questions.length-1?'See results':'Next question →')+'</button></div></section>';view.innerHTML=html;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(state.checked)return;let i=Number(b.dataset.choice);if(q.t==='multi'){state.picked.has(i)?state.picked.delete(i):state.picked.add(i)}else state.picked=new Set([i]);document.querySelectorAll('[data-choice]').forEach(el=>{let chosen=state.picked.has(Number(el.dataset.choice));el.classList.toggle('selected',chosen);el.setAttribute('aria-pressed',String(chosen))})});
$('#hint').onclick=()=>{$('#hintBox').classList.remove('hidden');$('#hintBox').textContent='Think back to the '+groups.find(g=>g[0]===q.g)[1]+' notes. Compare each choice with the lesson before deciding.';$('#hint').disabled=true};$('#check').onclick=check;$('#next').onclick=()=>{state.index++;state.index===state.questions.length?results():renderQuestion();window.scrollTo(0,0)}}
function check(){if(state.checked)return;let q=state.questions[state.index],good=false,given='';if(q.t==='match'){const inputs=[...document.querySelectorAll('[data-match]')];if(inputs.some(s=>!s.value)){$('#feedback').textContent='Match all the words first.';return}good=inputs.every((s,i)=>Number(s.value)===i);given=inputs.map((s,i)=>q.pairs[i][0]+': '+q.pairs[Number(s.value)][1]).join('; ');inputs.forEach(s=>s.disabled=true)}else{if(!state.picked.size){$('#feedback').textContent='Choose an answer first.';return}good=q.t==='multi'?q.answers.length===state.picked.size&&q.answers.every(i=>state.picked.has(i)):state.picked.has(q.answer);given=[...state.picked].map(i=>q.options[i]).join('; ');document.querySelectorAll('[data-choice]').forEach(b=>{let i=Number(b.dataset.choice);b.disabled=true;if(q.t==='multi'?q.answers.includes(i):i===q.answer)b.classList.add('good');else if(state.picked.has(i))b.classList.add('bad')})}state.checked=true;state.score+=Number(good);state.history.push({q,good,given});if(good)saved.missed=saved.missed.filter(id=>id!==q.id);else if(!saved.missed.includes(q.id))saved.missed.push(q.id);save();$('#feedback').innerHTML='<div class="feedback '+(good?'':'bad')+'"><strong>'+(good?'You got it!':'Remember this one.')+'</strong><p>'+esc(q.why)+'</p>'+(good?'':'<p>Answer: '+esc(correctAnswer(q))+'</p>')+'</div>';$('#check').disabled=true;$('#hint').disabled=true;$('#next').classList.remove('hidden')}
function results(){let pct=Math.round(state.score*100/state.questions.length),miss=state.history.filter(x=>!x.good).map(x=>x.q);saved.rounds++;saved.best=Math.max(saved.best,pct);save();best();view.innerHTML='<section class="card"><span class="eyebrow">Round complete</span><h2>'+(pct>=85?'Target achieved!':'Keep building your score')+'</h2><div class="result">'+pct+'%</div><p class="muted">'+state.score+'/'+state.questions.length+' right. '+(miss.length?'Review your missed answers and retry them.':'All questions remembered in this round!')+'</p><div class="actions">'+(miss.length?'<button id="retryNow" class="primary">Retry missed questions →</button>':'')+'<button id="newRound">New round</button><button id="overview">Overview</button></div></section><section class="card"><h3>Review the round</h3>'+state.history.map(x=>'<div class="review"><small class="muted">'+(x.good?'✓ Remembered':'↻ Retry')+'</small><strong style="display:block">'+esc(x.q.q)+'</strong><p>'+esc(x.q.why)+'</p>'+(x.good?'':'<small>Answer: '+esc(correctAnswer(x.q))+'</small>')+'</div>').join('')+'</section>';if($('#retryNow'))$('#retryNow').onclick=()=>startRound('all',miss.length,false,miss);$('#newRound').onclick=()=>startRound('all',10);$('#overview').onclick=()=>nav('home')}
function showTimeline(){view.innerHTML='<section class="card"><span class="eyebrow">London through time</span><h2>Timeline</h2><p class="muted">The dates and events that appear in Grace’s school notes.</p><div class="timeline">'+timeline.map(t=>'<section><strong>'+esc(t[0])+'</strong><p class="muted">'+esc(t[1])+'</p></section>').join('')+'</div></section>'}
function recall(){let q=cardDeck[cardIndex%cardDeck.length];view.innerHTML='<section class="card"><span class="eyebrow">Recall cards</span><h2>Can you remember?</h2><p class="muted">Say your answer aloud first, then reveal it.</p><div class="recall"><span class="eyebrow">'+groups.find(g=>g[0]===q.g)[1]+'</span><strong>'+esc(q.q)+'</strong><p id="recallAnswer" class="hidden">'+esc(correctAnswer(q))+'</p></div><div class="actions"><button id="flip" class="primary">Reveal answer</button><button id="later" class="hidden">Practise later</button><button id="remembered" class="hidden">I remembered →</button></div></section>';$('#flip').onclick=()=>{$('#recallAnswer').classList.remove('hidden');$('#later').classList.remove('hidden');$('#remembered').classList.remove('hidden');$('#flip').classList.add('hidden')};$('#later').onclick=()=>{cardDeck.push(q);cardIndex++;recall()};$('#remembered').onclick=()=>{cardIndex++;recall()}}
function showNotes(){view.innerHTML='<section class="card"><span class="eyebrow">Learn, then test</span><h2>Revision notes</h2><p class="muted">Key points taken from the photographed lessons, without adding extra topics.</p><div class="notes">'+notes.slice().reverse().map(n=>'<article><span class="eyebrow">'+n[1]+'</span><h3>'+n[0]+'</h3><p>'+esc(n[2])+'</p></article>').join('')+'</div><div class="actions"><button id="practice" class="primary">Practise 10 questions →</button></div></section>';$('#practice').onclick=()=>startRound('all',10)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));$('#start').onclick=()=>startRound('all',10);$('#reviewNotes').onclick=()=>nav('notes');home();
</script></body></html>
