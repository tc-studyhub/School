const notes=[["Timeline","<p><strong>Learn these six events from earliest to latest.</strong></p><ol><li>AD 43 · Roman invasion of Britain</li><li>1066 · Battle of Hastings</li><li>1348 · Black Death</li><li>1666 · Great Fire of London</li><li>1851 · Great Exhibition</li><li>1884 · Marks &amp; Spencer began</li></ol><p><strong>Learn the period dates as shown on the revision slide.</strong></p><ul><li>Medieval · 500–1500</li><li>Early Modern · 1450–1750</li><li>Industrial · 1750–1900</li><li>20th and 21st centuries · 1901–present</li></ul><details class=\"recall-check\"><summary>Which two events come after the Great Fire on the six-event timeline?</summary><p>Great Exhibition (1851), then Marks &amp; Spencer began (1884).</p></details>"],["Roman London","<p><strong>Why did trade matter?</strong><br>People could <mark>earn money</mark> and <mark>get the goods they needed</mark>.</p><p><strong>Compare the two periods.</strong><br>Roman London had markets where people bought and sold goods. Early Modern London also depended on trade for supplies.</p><h3>Practise an inference</h3>{{ROMAN_SOURCE}}<ol><li><strong>Clue</strong> · There are boats on the river and a bridge across it.<br><strong>Inference</strong> · The river was important for moving people and goods.</li><li><strong>Clue</strong> · Straight streets divide the buildings into blocks.<br><strong>Inference</strong> · The city appears to have been planned.</li></ol><details class=\"recall-check\"><summary>Say one inference and the clue that supports it.</summary><p>For example, the city appears to have been planned because the buildings are arranged in blocks along straight streets.</p></details>"],["Medieval London","<ul><li>1066 · Battle of Hastings. William of Normandy defeated Harold.</li><li>1348 · The Black Death reached England.</li></ul><details class=\"recall-check\"><summary>Which happened first, the Black Death or Hastings?</summary><p>Hastings (1066) came before the Black Death (1348).</p></details>"],["Early Modern London","<p><strong>Why did the Great Fire spread?</strong><br>It began in a bakery in Pudding Lane in 1666. Fire could spread quickly between closely packed wooden buildings.</p><p><strong>What happened as a result?</strong></p><ul><li>13,200 homes burned and around 100,000 people were left homeless.</li><li>London rebuilt in brick and stone. This made it harder for future fires to spread.</li><li>Fire insurance was set up after the fire.</li></ul><details class=\"recall-check\"><summary>Explain one consequence aloud. Can you give a fact and say why it mattered?</summary><p>London rebuilt in brick and stone. These materials catch fire less easily than wood, so future fires were less likely to spread from building to building.</p></details>"],["Industrial London","<ul><li>Steam power drove machinery and trains. Railways carried people and goods.</li><li>Factories and mines could be dangerous places to work, including for children.</li><li>1851 · The Great Exhibition displayed goods and inventions in the Crystal Palace in Hyde Park.</li><li>1884 · Marks &amp; Spencer began as a market stall.</li></ul><details class=\"recall-check\"><summary>Which came first, the Great Exhibition or Marks &amp; Spencer?</summary><p>The Great Exhibition (1851).</p></details>"],["Modern London","<ul><li>The class slide revisits the start of the First World War.</li><li>It also revisits wartime codebreaking in the Second World War.</li><li>The Shard is a modern London landmark.</li></ul><details class=\"recall-check\"><summary>Which war is covered by the video about the start of WW1?</summary><p>The First World War.</p></details>"],["Sources and PEEL","<p><strong>Primary or secondary?</strong><br>Primary · A witness’s diary from 1666. Secondary · A modern reconstruction of the fire.</p><p><strong>What do I write for an inference?</strong><br>Give two different conclusions. For each one, give a specific detail from the source that supports it.</p>{{FIRE_SOURCE}}<ul><li>Brick or stone buildings → London appears to have rebuilt with fire safety in mind.</li><li>Busy streets with people and carts → Everyday activity seems to have resumed.</li></ul><p><strong>What does PEEL mean?</strong><br>Point → Evidence → Explain → Link. For a comparison, give evidence from both periods. For a consequence, explain the result. Check how many the question asks for.</p><details class=\"recall-check\"><summary>Which is an inference: the street is busy, or everyday activity had resumed?</summary><p>Everyday activity had resumed. The busy street is the observation that supports it.</p></details>"]];

function show(markup){view.innerHTML=markup;view.focus({preventScroll:true});}
function page(name){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===name)));
 if(name==='levels') levels();if(name==='notes') note(0);if(name==='timeline') timeline();if(name==='written') writePractice();if(name==='review') review();}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.page)page(e.target.dataset.page);};
function levels(){
 show('<div class="grid">'+names.map((name,i)=>{const unlocked=i===0||saved.passes.includes(i-1);return '<section class="card"><h2>'+name+'</h2><p>'+descriptions[i]+'</p><button class="primary" data-level="'+i+'">'+(unlocked?'Start':'Preview')+'</button>'+(saved.passes.includes(i)?' <small>Passed</small>':'')+'</section>';}).join('')+'</div>');
 view.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.level);if(i&&!saved.passes.includes(i-1)){show('<section class="card"><h2>'+names[i]+'</h2><p>'+descriptions[i]+'</p><p>Pass '+names[i-1]+' to unlock this level.</p><button id="back">Back to levels</button></section>');document.querySelector('#back').onclick=levels;return;}if(i===3)mock();else round(shuffle(pools[i]).slice(0,6),i);});
}
function note(i){
 show('<section class="card"><label for="topic">Choose a topic</label> <select id="topic">'+notes.map(([title],n)=>'<option value="'+n+'"'+(n===i?' selected':'')+'>'+title+'</option>').join('')+'</select><h2>'+notes[i][0]+'</h2>'+notes[i][1].replace('{{ROMAN_SOURCE}}',romanScene).replace('{{FIRE_SOURCE}}',source)+'<div class="row"><button id="previous" '+(!i?'disabled':'')+'>Previous</button><button id="next" '+(i===notes.length-1?'disabled':'')+'>Next</button></div></section>');
 document.querySelector('#topic').onchange=e=>note(Number(e.target.value));document.querySelector('#previous').onclick=()=>note(i-1);document.querySelector('#next').onclick=()=>note(i+1);
}
function optionsFor(ids){
 const positions=shuffle(ids.map((_,i)=>i%4));
 return ids.map((id,i)=>{const [prompt,answer,distractor1,distractor2,distractor3]=bank[id];const options=shuffle([distractor1,distractor2,distractor3]);options.splice(positions[i],0,answer);return {id,prompt,answer,options,correct:positions[i]};});
}
function choices(item,name){return '<div class="choices">'+item.options.map((value,i)=>'<label><input required type="radio" name="'+name+'" value="'+i+'">'+value+'</label>').join('')+'</div>';}
function remember(id,answer,correct,isRetry){if(!correct&&!saved.missed[id])saved.missed[id]={answer};if(correct&&isRetry)delete saved.missed[id];save();}
function round(ids,level){
 const items=optionsFor(ids);let index=0,correct=0,unaided=0;
 function question(){
 const item=items[index];
 show('<section class="card"><small>Question '+(index+1)+' of '+items.length+'</small><progress value="'+index+'" max="'+items.length+'"></progress><form id="question"><h2>'+item.prompt+'</h2>'+(item.id===15?romanScene:[14,16].includes(item.id)?source:'')+choices(item,'pick')+'<details id="hint"><summary>Hint</summary><p>Think about the clues in '+notes[bank[item.id][5]][0]+'.</p></details><button class="primary">Check answer</button></form><div id="feedback" aria-live="polite"></div></section>');
 let hinted=false;document.querySelector('#hint summary').onclick=()=>{hinted=true;};
 document.querySelector('#question').onsubmit=e=>{e.preventDefault();const pick=Number(new FormData(e.target).get('pick'));const ok=pick===item.correct;correct+=Number(ok);unaided+=Number(ok&&!hinted);remember(item.id,item.options[pick],ok,level===null&&!hinted);
 e.target.querySelectorAll('input,button').forEach(el=>el.disabled=true);
 const output=document.querySelector('#feedback');output.innerHTML='<div class="feedback"><strong>'+(ok?'Correct':'Answer · '+item.answer)+'</strong><br>'+bank[item.id][6]+'</div><button id="next">'+(index+1===items.length?'See result':'Next question')+'</button>';document.querySelector('#next').focus();
 document.querySelector('#next').onclick=()=>{index++;if(index<items.length){question();return;}const passed=unaided>=5;if(level!==null&&passed&&!saved.passes.includes(level)){saved.passes.push(level);save();}
 show('<section class="card"><h2>'+correct+' / '+items.length+'</h2><p>'+unaided+' correct without hints.'+(level===null?'':passed?' Level passed.':' Get 5 correct without hints to unlock the next level.')+'</p><div class="row"><button id="back">Levels</button><button id="mistakes">Review mistakes</button></div></section>');document.querySelector('#back').onclick=levels;document.querySelector('#mistakes').onclick=review;};};
 }
 question();
}
function review(){
 const ids=Object.keys(saved.missed).map(Number).filter(i=>bank[i]);
 show('<section class="card"><h2>Review mistakes</h2>'+(ids.length?ids.map(i=>'<details><summary>'+bank[i][0]+'</summary><p>Your answer · '+saved.missed[i].answer+'<br>Correct answer · '+bank[i][1]+'</p><p>'+bank[i][6]+'</p><button data-note="'+bank[i][5]+'">Open related notes</button></details>').join('')+'<p><button id="retry" class="primary">Retry missed questions</button></p>':'<p>Your missed questions will appear here.</p>')+'</section>');
 view.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>note(Number(b.dataset.note)));if(ids.length)document.querySelector('#retry').onclick=()=>round(shuffle(ids),null);
}
function timeline(){
 const events=shuffle(dates), years=shuffle(dates.map(item=>item[1]));
 let mode='match',selected=-1,pairs={},order=[],checked=false;
 function draw(){
 const count=mode==='match'?Object.keys(pairs).length:order.length;
 show('<section class="card"><h2>Timeline quiz</h2><div class="row"><button id="match" aria-pressed="'+(mode==='match')+'">Match dates</button><button id="order" aria-pressed="'+(mode==='order')+'">Order events</button></div><p>'+(mode==='match'?'Tap an event, then its date. Tap a paired event again to remove the pair.':'Tap the events from earliest to latest. Tap an event again to remove it.')+'</p><div class="match">'+
 '<div>'+events.map(([event,date],i)=>'<p><button data-event="'+i+'" aria-pressed="'+(selected===i)+'" '+(checked?'disabled':'')+'>'+event+'<small>'+(mode==='match'?(pairs[i]||''):(order.includes(i)?order.indexOf(i)+1:''))+'</small></button>'+(checked?'<small> '+(mode==='match'?(pairs[i]===date?'✓':'→ '+date):(order.indexOf(i)===dates.findIndex(d=>d[0]===event)?'✓':'→ '+(dates.findIndex(d=>d[0]===event)+1)))+'</small>':'')+'</p>').join('')+'</div>'+
 (mode==='match'?'<div>'+years.map(year=>'<p><button data-year="'+year+'" '+(selected<0||checked?'disabled':'')+'>'+year+'</button></p>').join('')+'</div>':'')+
 '</div><button id="check" class="primary" '+(count!==6||checked?'disabled':'')+'>Check</button> <button id="again">Start again</button>'+(checked?'<p role="status">'+(mode==='match'?events.filter((d,i)=>pairs[i]===d[1]).length:order.filter((i,p)=>events[i][0]===dates[p][0]).length)+' / 6 correct</p>':'')+'</section>');
 document.querySelector('#match').onclick=()=>{mode='match';checked=false;selected=-1;draw();};document.querySelector('#order').onclick=()=>{mode='order';checked=false;draw();};
 view.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.event);if(mode==='order'){order=order.includes(i)?order.filter(n=>n!==i):[...order,i];draw();view.querySelector('[data-event="'+i+'"]').focus();return;}if(pairs[i]){delete pairs[i];selected=-1;}else{selected=i;}draw();const focusTarget=(selected<0?view.querySelector('[data-event="'+i+'"]'):view.querySelector('[data-year]'));focusTarget.focus();});
 view.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{const year=b.dataset.year;for(const i of Object.keys(pairs))if(pairs[i]===year)delete pairs[i];const event=selected;pairs[selected]=year;selected=-1;draw();view.querySelector('[data-event="'+event+'"]').focus();});
 document.querySelector('#check').onclick=()=>{checked=true;draw();};document.querySelector('#again').onclick=timeline;
 }
 draw();
}
function writtenFields(prefix){return writing.map(([question],i)=>'<article><h3><label for="'+prefix+i+'">'+(i+1)+'. '+question+' [4 marks]</label></h3>'+(i===2?source:'')+'<textarea id="'+prefix+i+'" placeholder="Type here or write on paper"></textarea></article>').join('');}
function marking(){return writing.map(([question,model,checks],i)=>'<details><summary>Question '+(i+1)+' · Model and marking</summary><p>'+model+'</p>'+checks.split('|').map(check=>'<label class="mark"><input class="self" type="checkbox"> '+check+'</label>').join('')+'</details>').join('');}

function mock(){
 const skill=optionsFor(shuffle(pools[2]).slice(0,8));const knowledge=optionsFor(shuffle(Array.from({length:12},(_,i)=>24+i)));
 const fields=(items,prefix)=>items.map((item,i)=>'<div><h3>'+(i+1)+'. '+item.prompt+'</h3>'+choices(item,prefix+i)+'</div>').join('');
 show('<form id="mock"><section class="card"><h2>Section 1 · Skills /12</h2><p>Answer eight multiple-choice questions and four short-answer questions.</p>'+romanScene+source+fields(skill,'s')+shorts.map(([prompt],i)=>'<p><label for="short'+i+'">'+(9+i)+'. '+prompt+'</label><input type="text" id="short'+i+'" name="short'+i+'"></p>').join('')+'</section><section class="card"><h2>Section 2 · Knowledge /12</h2>'+fields(knowledge,'k')+'</section><section class="card"><h2>Section 3 · Exam-style questions /12</h2>'+writtenFields('mockWrite')+'<p><button class="primary">Finish and mark</button></p></section></form><div id="mockResult"></div>');
 document.querySelector('#mock').onsubmit=e=>{e.preventDefault();const form=e.target;const data=new FormData(form);let score=0;const misses=[];
 for(const [items,prefix] of [[skill,'s'],[knowledge,'k']])items.forEach((item,i)=>{const pick=Number(data.get(prefix+i));const correct=pick===item.correct;score+=Number(correct);remember(item.id,item.options[pick],correct,false);if(!correct)misses.push('<li>'+item.prompt+' <b>'+item.answer+'</b> '+bank[item.id][6]+'</li>');});
 form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);
 const results=document.querySelector('#mockResult');
 results.innerHTML='<section class="card"><h2>Mark your mock</h2><p>'+score+' / 20 multiple-choice marks. Add the short answers and written marks below. Award one point for each check you met.</p>'+(misses.length?'<details><summary>Multiple-choice corrections</summary><ul>'+misses.join('')+'</ul></details>':'')+'<h3>Short answers</h3>'+shorts.map(([prompt,answer])=>'<label class="mark"><input type="checkbox" class="self"> '+prompt+' <b>'+answer+'</b></label>').join('')+'<h3>Written answers</h3>'+marking()+'<p id="total" role="status"></p></section>';
 const total=()=>{const points=score+results.querySelectorAll('.self:checked').length;document.querySelector('#total').textContent=points+' / 36 · '+Math.round(points/36*100)+'% · Target 31 / 36';if(points>=31&&!saved.passes.includes(3))saved.passes.push(3);save();};results.onchange=total;document.querySelector('#total').textContent='Multiple-choice marks so far · '+score+' / 36';results.scrollIntoView();
 };
}
