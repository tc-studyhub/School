<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose your Study Hub password</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#1d2939;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:480px;margin:50px auto;padding:30px;background:#fff;border:1px solid #dce4ee;border-radius:22px}h1{font-size:29px;line-height:1.2;margin:0 0 15px}p{color:#526175}label{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}input{display:block;width:100%;font:18px inherit;color:#1d2939;border:1px solid #adbed2;border-radius:11px;padding:14px}button{width:100%;min-height:48px;background:#006ad4;color:white;border:0;border-radius:12px;padding:12px 16px;font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-top:24px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{font-size:14px}.good{background:#e8f7ee;border-radius:13px;padding:18px;color:#176247}.error{color:#a02b2b}small{display:block;color:#526175;font-size:12px;margin-top:18px}@media(max-width:540px){.box{margin:22px 16px;padding:24px}}</style></head><body><main class="box"><h1>Choose your family password</h1><p>Set the password you’d like Adel and Grace to use for the Study Hub home screen.</p><form id="setup"><label for="current-password">Current password</label><input id="current-password" name="current-password" type="password" autocomplete="current-password" required><label for="new-password">New password</label><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit" disabled>Set my password</button></form><p id="status" class="status" role="status">Checking browser encryption…</p><small>Your password stays in this browser. The update file contains the encrypted menu, not your password. I’ll apply that file to the website next.</small></main><script>let TEMPLATE='';const status=document.querySelector('#status'),form=document.querySelector('#setup'),button=document.querySelector('#save');async function loadCurrent(){if(!window.crypto?.subtle){status.classList.add('error');status.textContent='This page needs HTTPS for browser encryption. Do not enter a password yet.';return}try{const response=await fetch('./index.html',{cache:'no-store'});if(!response.ok)throw new Error('load');TEMPLATE=await response.text();if(!/const LOCK=\{.*?\},main=/s.test(TEMPLATE))throw new Error('format');button.disabled=false;status.textContent='Enter your current family password, then choose a new one. I will apply the update to the website after you finish.'}catch(e){status.classList.add('error');status.textContent='The current website could not be loaded. Please tell me before continuing.'}}loadCurrent();const encode=a=>btoa(String.fromCharCode(...new Uint8Array(a)));form.onsubmit=async e=>{e.preventDefault();const old=document.querySelector('#current-password'),p=document.querySelector('#new-password'),q=document.querySelector('#confirm-password');if(p.value!==q.value){status.className='status error';status.textContent='The two passwords do not match.';q.focus();return}button.disabled=true;button.textContent='Preparing update…';try{const previous=JSON.parse(TEMPLATE.match(/const LOCK=(\{.*?\}),main=/s)[1]);const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const previousMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(old.value),'PBKDF2',false,['deriveKey']);const previousKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(previous.salt),iterations:previous.iterations,hash:'SHA-256'},previousMaterial,{name:'AES-GCM',length:256},false,['decrypt']);const MENU=new TextDecoder('utf-8',{fatal:true}).decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(previous.iv)},previousKey,decode(previous.ciphertext)));const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(MENU));const cfg={salt:encode(salt),iv:encode(iv),ciphertext:encode(encrypted),iterations:600000,version:'school-menu-'+Array.from(salt.slice(0,6),n=>n.toString(16).padStart(2,'0')).join('')};const changed=TEMPLATE.replace(/const LOCK=\{.*?\},main=/s,()=> 'const LOCK='+JSON.stringify(cfg)+',main=');if(changed===TEMPLATE)throw new Error('template');old.value='';p.value='';q.value='';form.classList.add('hidden');form.style.display='none';status.className='status good';status.textContent='Ready to apply. Your new password has been set in the update file. Tell me “done” and I’ll publish it.';const blob=new Blob([changed],{type:'text/html'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='index.html';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),60000);}catch(err){old.value='';p.value='';q.value='';button.disabled=false;button.textContent='Set my password';status.className='status error';status.textContent='The current password did not unlock the menu, or this browser could not prepare the update. Please check the current password.'}};</script></body></html>
