<header><a href="./">← Adel’s subjects</a><div class="hero"><img data-visual="eruption" alt=""><div class="hero-text"><small>YEAR 9 GEOGRAPHY</small><h1>Tectonic Hazards</h1><p>Explore the diagrams. Unlock four levels.</p></div></div></header>
<nav aria-label="Study sections"><button data-view="notes" aria-pressed="false">Visual notes</button><button data-view="quiz" aria-pressed="true">Levels</button><button data-view="review" aria-pressed="false">Review mistakes</button></nav>
<section id="notes" aria-label="Revision notes" hidden><div id="notes-content"></div><template id="notes-template">
<details id="hazard"><summary>1. What is a natural hazard?</summary><p>An extreme natural event that can cause loss of life, damage property or disrupt people’s lives. A volcanic eruption can threaten people and buildings nearby.</p><small class="source">What Are Natural Hazards? · PDF p. 6</small></details>
<details id="earth"><summary>2. What are Earth’s layers and how do the two types of crust compare?</summary><svg class="figure" viewBox="0 0 350 155" role="img" aria-label="A cutaway of Earth: thin blue crust, peach mantle, amber liquid outer core and red solid inner core."><circle cx="175" cy="77" r="72" fill="#2f7895"/><circle cx="175" cy="77" r="66" fill="#f8d7aa"/><circle cx="175" cy="77" r="42" fill="#ef9d46"/><circle cx="175" cy="77" r="20" fill="#b74234"/><g fill="none" stroke="#46546a" stroke-width="1.5"><path d="M107 66H55M220 48H284M207 99H284M159 83l-20 31H65"/></g><g fill="#18233a" font-size="13"><text x="12" y="70">Crust</text><text x="289" y="52">Mantle</text><text x="289" y="96">Outer</text><text x="289" y="111">core</text><text x="10" y="118">Inner core</text></g></svg><div class="panel" aria-label="Layers from the surface to the centre"><div class="layer"><strong>Crust</strong> · Thin outer layer of solid rock</div><div class="layer"><strong>Mantle</strong> · Thick layer of hot rock that flows slowly</div><div class="layer"><strong>Outer core</strong> · Liquid metal, mainly iron and nickel</div><div class="layer"><strong>Inner core</strong> · Solid metal under immense pressure</div></div><div class="compare"><div><strong>Oceanic crust</strong><br>Denser, mainly basalt, about 6–7 km thick in most places.</div><div><strong>Continental crust</strong><br>Less dense, mainly granite, typically about 20–70 km thick in the lesson comparison.</div></div><small class="source">The Structure of the Earth · PDF pp. 9, 15</small></details>
<details id="drift"><summary>3. What evidence supports continental drift?</summary><figure class="lesson-image"><img data-visual="drift" alt="Map of connected continents showing matching fossil bands across land that is now separated."><figcaption>Follow each coloured fossil band across the joined continents.</figcaption></figure><p>Wegener proposed that the continents had once formed a supercontinent called <strong>Pangaea</strong> before drifting apart.</p><ul><li><strong>Continental shapes.</strong> The outlines of continents on opposite sides of the Atlantic appear to fit together.</li><li><strong>Matching rocks and mountains.</strong> Rocks of the same age and mountain belts with matching rock types across the Atlantic suggest they formed together.</li><li><strong>Matching fossils.</strong> Fossils of organisms such as Mesosaurus appear on continents separated by oceans the animals could not have crossed.</li><li><strong>Ancient climates.</strong> Glacial marks near today’s equator and tropical coral fossils in cold regions suggest the land once lay at different latitudes.</li></ul><small class="source">What Is Plate Tectonics? · PDF pp. 13, 16, 21–30</small></details>
<details id="convection"><summary>4. How do convection currents move plates?</summary><svg class="figure" viewBox="0 0 350 153" role="img" aria-label="Hot, less dense mantle rises on the left, flows near the crust, cools and sinks on the right, and flows back near the core."><rect x="8" y="8" width="334" height="137" rx="15" fill="#eef6fc"/><g fill="none" stroke="#16748b" stroke-width="3"><path d="M94 104V43l-6 7m6-7 6 7M119 33h111l-7-6m7 6-7 6M257 45v60l-6-7m6 7 6-7M230 117H120l7-6m-7 6 7 6"/></g><g fill="#1d2939" font-size="13" text-anchor="middle"><text x="175" y="22">Near the crust</text><text x="55" y="77">Rises</text><text x="296" y="77">Sinks</text><text x="175" y="137">Heat from the core</text></g></svg><p>Heat from the core warms material in the lower mantle. It becomes less dense and slowly rises. Near the crust it cools, becomes denser and sinks. This circulation helps move the plates above it.</p><small class="source">What Is Plate Tectonics? · PDF pp. 33–34, 40</small></details>
<details id="margins"><summary>5. What are the four plate margins?</summary><figure class="lesson-image"><img data-visual="collision" alt="Snow-covered peaks in the Himalayas."><figcaption>The Himalayas formed where two continental plates collided. Plate Margins PDF p. 18.</figcaption></figure><div class="panel"><p><strong>Destructive · → ←</strong> Oceanic and continental plates converge. The denser oceanic plate subducts and crust is recycled. Earthquakes and volcanoes can occur.</p><p><strong>Constructive · ← →</strong> Plates diverge. Magma rises and cools to form new crust. Shallow earthquakes and volcanic eruptions can occur.</p><p><strong>Collision · → ←</strong> Two continental plates converge and the crust folds up into mountains. Earthquakes can occur. The lesson model shows no volcanoes.</p><p><strong>Conservative · ↑ ↓</strong> Plates slide past each other. Crust is neither created nor destroyed. Earthquakes can occur without volcanic activity.</p></div><small class="source">What Are Plate Margins? · PDF p. 26</small></details>
<details id="earthquakes"><summary>6. Why do earthquakes and volcanoes occur at different margins?</summary><div class="visual-grid"><figure class="lesson-image"><img data-visual="subduction" alt="An oceanic plate sinks beneath a continental plate with a volcano."><figcaption>Destructive · the oceanic plate sinks.</figcaption></figure><figure class="lesson-image"><img data-visual="spreading" alt="Two plates separate and magma rises in the gap."><figcaption>Constructive · the plates move apart.</figcaption></figure></div><p><strong>Destructive.</strong> The plates can lock. Stress builds until they slip and release energy as an earthquake. Subduction also leads to magma formation and volcanic eruptions.</p><p><strong>Constructive.</strong> Plates pulling apart can fracture the shallow crust and trigger earthquakes. Rising magma can erupt and create new crust as it cools.</p><p><strong>Collision.</strong> Converging continental plates squeeze and deform the crust. Sudden movement as stress is released can cause earthquakes.</p><p><strong>Conservative.</strong> Friction locks the sliding plates. Stress builds until they suddenly slip, releasing energy as an earthquake.</p><small class="source">What Are Plate Margins? · PDF pp. 6, 12, 18, 21, 26 · How Does Tectonic Plate Movement Create Volcanoes? · PDF pp. 12–15</small></details>
<details id="volcano"><summary>7. What is a volcano?</summary><figure class="lesson-image"><img data-visual="eruption" alt="A steep-sided volcano with a plume rising from its vent."><figcaption>Look for the plume above the opening at the summit.</figcaption></figure><p>An opening in Earth’s crust through which lava, gases, ash and other rock material can erupt. Molten rock is called <strong>magma</strong> underground and <strong>lava</strong> once it reaches the surface.</p><small class="source">How Does Tectonic Plate Movement Create Volcanoes? · PDF pp. 5–6</small></details>
<details id="shapes"><summary>8. How do shield and composite volcanoes compare?</summary><svg class="figure" viewBox="0 0 350 110" role="img" aria-label="Shield volcano with a broad, gently sloping profile beside a taller, steep-sided composite volcano."><path d="M8 77Q34 73 56 60Q83 38 109 59Q131 73 164 77Z" fill="#72c2b3"/><path d="M188 77Q215 72 245 23H259Q286 72 337 77Z" fill="#d9a58d"/><path d="M215 63H300M229 49H283" stroke="#a5634d" stroke-width="3"/><g fill="#1d2939" font-size="14" text-anchor="middle"><text x="85" y="99">Shield</text><text x="262" y="99">Composite</text></g></svg><div class="compare"><div><strong>Shield</strong><br>Broad and gently sloping. Runny lava spreads far, usually in gentler eruptions.</div><div><strong>Composite</strong><br>Steeper sides. Layers of ash and lava build up over repeated eruptions, which can be explosive.</div></div><small class="source">How Does Tectonic Plate Movement Create Volcanoes? · PDF pp. 12–15</small></details>
<details id="formation"><summary>9. How do composite, shield and hotspot volcanoes form?</summary><p><strong>Composite at a destructive margin.</strong> Denser oceanic crust subducts. Magma forms and rises. Pressure can build beneath the surface before an eruption. Repeated eruptions build up layers of ash and lava.</p><p><strong>Shield at a constructive margin.</strong> The plates pull apart. Magma rises and erupts. Runny lava spreads over a wide area and cools. Repeated flows build a broad shield.</p><div class="panel"><strong>Hotspot formation · USGS supplement</strong><p>Hot mantle rises and melting produces magma. Magma can erupt through the plate, building a volcano above the hotspot. As the plate moves over the relatively fixed hotspot, another volcano can form, leaving a chain such as Hawai‘i.</p><small>The class slides mention hotspots away from plate margins. <a href="https://www.usgs.gov/geology-and-ecology-of-national-parks/geology-hawaii-volcanoes-national-park">USGS explanation of the Hawaiian hotspot</a></small></div><small class="source">How Does Tectonic Plate Movement Create Volcanoes? · PDF pp. 6, 12–16, 19–21</small><small class="source">Science clarification for subduction: water released from the sinking plate helps hot mantle rock melt. <a href="https://www.usgs.gov/faqs/are-tectonic-plates-floating-magma">USGS explanation</a></small></details>
</template></section>

'Heat from the core warms material low in the mantle. It becomes less dense and rises. Near the crust it cools, becomes denser and sinks. The cycle helps move the plates above.',

write('w3','earthquakes','Explain how an earthquake forms at a conservative margin.',

write('w4','formation','Explain how a composite volcano forms at a destructive margin. (4 marks)',

let noteIndex=0;
function iconFor(id){
  const path=topics.find(([name])=>name===id)[2];
  const icon=element('span','',{class:'icon','aria-hidden':'true'});
  icon.innerHTML='<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg>';
  return icon;
}
function openNote(index,focus=false){
  noteIndex=index;
  const [id,label]=topics[index];
  const template=document.getElementById('notes-template').content.querySelector('#'+id);
  const content=document.getElementById('notes-content');
  const toolbar=element('div','',{class:'note-toolbar'});
  const prev=button('← Previous',()=>openNote(index-1,true));
  const next=button('Next →',()=>openNote(index+1,true));
  prev.disabled=index===0;next.disabled=index===topics.length-1;
  toolbar.append(prev,element('strong',(index+1)+' / '+topics.length),next);
  const card=element('div','',{class:'note-card',id});
  const kicker=element('div','',{class:'note-kicker'});
  kicker.append(iconFor(id),element('span',label));
  const title=element('h2',template.querySelector('summary').textContent.replace(/^\d+\. /,''),{tabindex:'-1'});
  card.append(kicker,title,...Array.from(template.children).slice(1).map(node=>node.cloneNode(true)));
  const flash=practice.find(q=>q.topic===id&&q.type==='choice');
  if(flash){
    const check=element('details','',{class:'panel'});
    check.append(element('summary','Quick recall · '+flash.prompt.replace(/^Which definition describes a natural hazard\?$/,'Can you define a natural hazard?')),element('p',flash.why));
    card.append(check);
  }
  hydrate(card);
  const grid=element('div','',{class:'topic-grid','aria-label':'Choose a revision topic'});
  topics.forEach(([key,name],i)=>{
    const pick=button('',()=>openNote(i,true));
    pick.append(iconFor(key),element('span',name));
    if(i===index)pick.setAttribute('aria-current','true');
    grid.append(pick);
  });
  content.replaceChildren(toolbar,card,grid);
  if(focus){title.focus({preventScroll:true});toolbar.scrollIntoView({block:'start',behavior:'instant'});}
}

function element(tag,content,attrs={}) {
  const node=document.createElement(tag);
  node.textContent=content;
  for(const [name,value] of Object.entries(attrs))node.setAttribute(name,value);
  return node;
}
function button(label,handler,kind=''){
  const node=element('button',label,{type:'button',class:kind});node.addEventListener('click',handler);return node;
}
function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
  return copy;
}
function show(view){
  for(const name of ['notes','quiz','review'])document.getElementById(name).hidden=name!==view;
  for(const tab of document.querySelectorAll('[data-view]'))tab.setAttribute('aria-pressed',String(tab.dataset.view===view));
  if(view==='review')renderReview();
  if(view==='notes'&&!document.querySelector('.note-card'))openNote(noteIndex);
}
for(const tab of document.querySelectorAll('[data-view]'))tab.addEventListener('click',()=>show(tab.dataset.view));
function noteLink(topic){
  const link=element('a','Open the revision note',{href:'#'+topic,class:'note-link'});
  link.addEventListener('click',event=>{
    event.preventDefault();show('notes');
    openNote(topics.findIndex(([id])=>id===topic),true);
  });
  return link;
}
function menu(){
  session=null;feedback.textContent='';
  quiz.replaceChildren(element('h2','Choose a level'));
  const grid=element('div','',{class:'level-grid'});
  levels.forEach((level,index)=>{
    const score=saved.levels[level.name];
    const unlocked=index===0||!!saved.levels[levels[index-1].name]?.passed;
    const card=element('article','',{class:score?.passed?'is-passed':unlocked?'':'is-locked'});
    const status=score?.passed?'Cleared · '+score.best+'/'+level.questions.length:
      unlocked?(score?'Best '+score.best+'/'+level.questions.length+' · ':'')+'Pass with '+level.pass+'/'+level.questions.length:
      'Unlocks after '+levels[index-1].name;
    card.append(iconFor(level.icon),element('h3',level.name),element('p',level.description),element('div',status,{class:'status'}));
    const play=button(unlocked?(score?'Replay':'Start '+level.name):'Locked',()=>start(level.questions,level.mode||'level',level),unlocked&&!score?.passed?'primary':'');
    play.disabled=!unlocked;
    card.append(play);grid.append(card);
  });
  quiz.append(grid);
  const written=element('article','');
  written.append(element('h3','Written practice'),element('p','Try the assessment-style explanations and mark them against the model answers.'),button('Practise written answers',()=>start(explanations,'written')));
  quiz.append(written);
  if(saved.legend)quiz.append(element('p','First Legend score · '+saved.legend.score+'%'));
  else if(saved.mixed)quiz.append(element('p','Previous mixed score · '+saved.mixed.score+'%'));
}
function start(questions,mode,level=null){
  if(level&&levels.indexOf(level)>0&&!saved.levels[levels[levels.indexOf(level)-1].name]?.passed)return;
  const ordered=level?shuffle(questions):questions;
  const choiceCount=ordered.filter(q=>q.type==='choice').length;
  const positions=shuffle(Array.from({length:choiceCount},(_,i)=>i%4));
  session={questions:ordered,mode,level,index:0,correct:0,streak:0,hint:false,assisted:false,positions,results:[]};
  show('quiz');renderQuestion();
}
function scoreRows(q,answers){
  return q.items.map(([label,correct],i)=>({label,answer:answers[i],correct,ok:answers[i]===correct}));
}
function orderInteraction(q){
  const node=element('div','');
  const list=element('ol','',{class:'order-answer','aria-label':'Your order'});
  const bank=element('div','',{class:'choice-bank'});
  const status=element('p','Tap the steps in order. Tap a placed step to remove it.',{class:'interaction-status','aria-live':'polite'});
  const options=shuffle(q.items.map(([,answer])=>answer));
  const ordered=[];
  const buttons=options.map(answer=>button(answer,()=>{
    ordered.push(answer);render();list.lastChild.firstChild.focus();
  }));
  function render(){
    list.replaceChildren();
    ordered.forEach((answer,i)=>{
      const row=element('li','');
      row.append(button(answer+' ×',()=>{ordered.splice(i,1);render();buttons[options.indexOf(answer)].focus();}));
      list.append(row);
    });
    buttons.forEach((option,i)=>option.disabled=ordered.includes(options[i]));
    status.textContent=ordered.length===options.length?'All steps placed. Check your answer.':ordered.length+' of '+options.length+' placed. Tap a placed step to remove it.';
  }
  bank.append(...buttons);node.append(status,list,bank);
  return {node,read:()=>ordered.length===options.length?scoreRows(q,ordered):null};
}
function pairInteraction(q){
  const node=element('div','');
  const status=element('p','Tap a label on the left, then its match on the right.',{class:'interaction-status','aria-live':'polite'});
  const grid=element('div','',{class:'pair-grid'});
  const left=element('div',''),right=element('div','');
  const options=shuffle(q.items.map(([,answer])=>answer));
  const answers=Array(q.items.length).fill('');
  let active=-1;
  const labels=q.items.map(([label],i)=>button(label,()=>{
    if(active===i&&answers[i]){answers[i]='';active=-1;}
    else active=i;
    render();
  }));
  const choices=options.map(answer=>button(answer,()=>{
    if(active<0)return;
    const previous=answers.indexOf(answer);
    if(previous!==-1)answers[previous]='';
    answers[active]=answer;
    active=-1;render();
  }));
  function render(){
    labels.forEach((item,i)=>{
      item.setAttribute('aria-pressed',String(active===i));
      item.dataset.paired=String(!!answers[i]&&active!==i);
      item.textContent=q.items[i][0]+(answers[i]?' · '+answers[i]:'');
    });
    choices.forEach((item,i)=>{
      item.dataset.paired=String(answers.includes(options[i]));
    });
    status.textContent=active<0?(answers.every(Boolean)?'All pairs set. Check your answer.':'Tap a label, then its match.'):
      'Selected '+q.items[active][0]+'. Tap a match'+(answers[active]?' or tap this label again to clear it.':'.');
  }
  left.append(...labels);right.append(...choices);grid.append(left,right);node.append(status,grid);
  return {node,read:()=>answers.every(Boolean)?scoreRows(q,answers):null};
}

function diagram(q){
  const figure=element('div','',{class:'panel'});
  if(q.id==='m2'){
    const shapes='<circle cx="90" cy="80" r="69" fill="#c6e6f6"/><circle cx="90" cy="80" r="61" fill="#f7d5aa"/><circle cx="90" cy="80" r="38" fill="#f5bc79"/><circle cx="90" cy="80" r="18" fill="#ee9979"/>';
    const labels='<g stroke="#475569" fill="none"><path d="M145 40H215M141 64H215M120 92H215M91 84L128 122H215"/></g><g fill="#1d2939" font-size="14"><text x="222" y="42">1</text><text x="222" y="69">2</text><text x="222" y="96">3</text><text x="222" y="127">4</text></g>';
    figure.innerHTML='<svg viewBox="0 0 250 160" class="figure" role="img" aria-label="Earth cross-section with four numbered layers, from the surface to the centre.">'+shapes+labels+'</svg>';
  }
  return figure;
}
function renderQuestion(){
  feedback.textContent='';
  const q=session.questions[session.index];session.hint=false;
  const title=element('h2',(session.level?.name||'Practice')+' · '+(session.index+1)+' / '+session.questions.length,{tabindex:'-1'});
  const form=element('form','',{class:'question'});
  const field=element('fieldset','');
  field.append(element('legend',q.prompt));
  const top=element('div','',{class:'quiz-top'});top.append(button('← Levels',menu),title);
  quiz.replaceChildren(top,element('progress','',{class:'track',value:session.index,max:session.questions.length,'aria-label':'Questions completed'}),form);
  form.append(field);
  if(q.id==='m2')field.append(diagram(q));
  let read;
  if(q.type==='choice'){
    const options=shuffle(q.options.slice(1));
    options.splice(session.positions.shift(),0,q.options[0]);
    options.forEach(option=>{
      const label=element('label','',{class:'option'});
      label.append(element('input','',{type:'radio',name:'choice',value:option,required:''}),document.createTextNode(option));
      field.append(label);
    });
    read=()=>{const answer=new FormData(form).get('choice');return [{answer,correct:q.options[0],ok:answer===q.options[0]}];};
  }else if(q.type==='rows'){
    const interaction=q.order?orderInteraction(q):pairInteraction(q);
    field.append(interaction.node);
    read=interaction.read;
  }else{
    const label=element('label','Your explanation',{class:'row'});
    const input=element('textarea','',{required:''});
    label.append(input);field.append(label);
    read=()=>input.value.trim();
  }
  const actions=element('div','',{class:'actions'});
  actions.append(element('button',q.type==='written'?'Check against the model':session.mode==='mixed'?'Submit and continue':'Check answer',{type:'submit',class:'primary'}));
  if(session.mode!=='mixed'&&!session.level)actions.append(button('Hint',()=>{
    session.hint=true;session.assisted=true;
    feedback.replaceChildren(document.createTextNode('Look for the process or comparison in the matching note.'),element('br',''),noteLink(q.topic));
  }));
  form.append(actions);
  form.addEventListener('submit',event=>{
    event.preventDefault();const answer=read();
    if(!answer){feedback.textContent='Complete every slot before checking.';return;}
    if(q.type==='written'&&!answer.trim()){feedback.textContent='Write a short explanation first.';return;}
    feedback.textContent='';field.disabled=true;actions.remove();
    if(q.type==='written'){
      form.append(element('p','Model answer: '+q.why,{class:'panel'}));
      const list=element('ul','');list.append(...q.points.map(point=>element('li',point)));
      form.append(list);
      const choices=element('div','',{class:'actions'});
      choices.append(button('I included those points',()=>finishWritten(q,answer,true)),button('I missed a point',()=>finishWritten(q,answer,false)));
      form.append(choices);
      choices.firstChild.focus();
    }else{
      const ok=answer.every(part=>part.ok);
      record(q,answer,ok);
      if(ok){session.correct++;session.streak++;}else session.streak=0;
      if(session.mode==='mixed'){
        session.results.push({q,answer,ok});
        advance();
        return;
      }
      const result=element('p',ok?(session.streak>=2?'Correct · '+session.streak+' in a row':'Correct.'):'Check your answer.',{class:ok?'ok':'bad',tabindex:'-1'});
      form.append(result);
      if(!ok){
        const list=element('ul','');
        list.append(...answer.filter(part=>!part.ok).map(part=>element('li',(part.label?part.label+' · ':'')+'You chose '+part.answer+'. Answer: '+part.correct+'.')));
        form.append(list);
      }
      form.append(element('p',q.why),noteLink(q.topic),element('br',''),nextButton());
      result.focus();
    }
  });
  title.focus();
}
function record(q,answer,ok){
  if(!saved.first[q.id])saved.first[q.id]={answer,ok,hint:session.hint};
  if(ok)delete saved.missed[q.id];
  else saved.missed[q.id]={answer};
  persist();
}
function finishWritten(q,answer,ok){record(q,answer,ok);if(ok)session.correct++;advance();}
function nextButton(){
  return button(session.index+1===session.questions.length?'See results':'Next question',advance,'primary');
}
function advance(){
  session.index++;
  if(session.index<session.questions.length){renderQuestion();return;}
  const total=session.questions.length;
  const score=Math.round(100*session.correct/total);
  const level=session.level;
  const passed=level&&session.correct>=level.pass;
  if(level){
    const best=saved.levels[level.name]||{best:0,passed:false};
    saved.levels[level.name]={best:Math.max(best.best,session.correct),passed:best.passed||passed};
  }
  if(session.mode==='mixed'&&!saved.legend)saved.legend={score,correct:session.correct,total};
  persist();
  const title=element('h2',level?(passed?level.name+' cleared':level.name+' complete'):'Challenge complete',{tabindex:'-1'});
  const result=session.mode==='written'?session.correct+' of '+total+' explanations self-checked.':session.correct+' of '+total+' correct · '+score+'%';
  const banner=element('div','',{class:'result-banner'});banner.append(title,element('p',result));quiz.replaceChildren(banner);
  const next=level?levels[levels.indexOf(level)+1]:null;
  if(level&&!passed)quiz.append(element('p','Clear this level with '+level.pass+' correct. Review any misses, then try again.'));
  if(session.mode==='mixed'){
    quiz.append(element('p',session.correct/total>=.85?'85% target reached on this attempt.':'Review the missed topics, then try Legend again.'));
    quiz.append(element('p','Your first Legend score was '+saved.legend.score+'%.'));
  }else if(session.assisted)quiz.append(element('p','This attempt used revision notes.'));
  const actions=element('div','',{class:'actions'});
  if(passed&&next)actions.append(button('Start '+next.name,()=>start(next.questions,next.mode,next),'primary'));
  actions.append(button('Review mistakes',()=>show('review')),button('All levels',menu));
  quiz.append(actions);
  if(session.mode==='mixed'){
    for(const {q,answer,ok} of session.results.filter(item=>!item.ok)){
      const card=element('article','');
      card.append(element('h3',q.prompt));
      for(const part of answer.filter(p=>!p.ok))card.append(element('p',(part.label?part.label+' · ':'')+'You chose '+part.answer+'. Answer: '+part.correct+'.'));
      card.append(element('p',q.why),noteLink(q.topic));
      quiz.append(card);
    }
  }
  title.focus();
}
function renderReview(){
  const ids=Object.keys(saved.missed).filter(id=>lookup.has(id));
  review.replaceChildren(element('h2','Review mistakes'));
  if(!ids.length)review.append(element('p','Questions you miss will appear here.'));
  for(const type of ['automatic','written']){
    const questions=ids.map(id=>lookup.get(id)).filter(q=>(q.type==='written')===(type==='written'));
    if(questions.length)review.append(button(type==='written'?'Retry written explanations':'Retry missed questions',()=>start(questions,type==='written'?'written':'retry'),'primary'));
  }
  for(const id of ids){
    const q=lookup.get(id);
    const answer=saved.missed[id].answer;
    const card=element('article','');
    card.append(element('h3',q.prompt));
    if(typeof answer==='string')card.append(element('p','Your answer: '+answer));
    else for(const part of answer.filter(p=>!p.ok))card.append(element('p',(part.label?part.label+' · ':'')+'You chose '+part.answer+'. Answer: '+part.correct+'.'));
    card.append(element('p',q.why),noteLink(q.topic));review.append(card);
  }
  review.append(element('p','Progress is saved on this device.'));
  review.append(button('Reset this topic’s progress',()=>{
    if(!window.confirm('Clear the saved scores and mistakes for Tectonic Hazards on this device?'))return;
    saved={missed:{},first:{},mixed:null,levels:{}};persist();menu();renderReview();
  }));
}
menu();
hydrate(document);
</script></body></html>
